[project]
name = "fpl-shadow-manager"
version = "0.1.0"
description = "AI-first Fantasy Premier League shadow manager"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
"aiosqlite>=0.20",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "apscheduler>=3.10,<4",
  "openai>=1.60",
  "tenacity>=9.0",
  "python-dotenv>=1.0",
  "youtube-transcript-api>=0.6.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100


